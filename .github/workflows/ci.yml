name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate (HTML/CSS/JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax check
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            echo "→ node --check $f"
            node --check "$f"
            found=1
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "Hiç .js dosyası bulunamadı"; exit 1
          fi

      - name: Required files present
        run: |
          set -e
          for f in index.html style.css game.js; do
            test -f "$f" || { echo "EKSİK: $f"; exit 1; }
            echo "✓ $f"
          done

      - name: Referenced assets exist
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:href|src)="([^"]+)"/g)]
            .map(m => m[1])
            .filter(p => !/^https?:\/\//.test(p));
          let ok = true;
          for (const r of refs) {
            if (fs.existsSync(r)) {
              console.log('✓ referans:', r);
            } else {
              console.error('✗ EKSİK referans:', r);
              ok = false;
            }
          }
          if (!ok) process.exit(1);
          EOF
